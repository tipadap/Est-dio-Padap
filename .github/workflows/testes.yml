# Roda os testes a cada push e pull request. Com "Wait for CI" ligado no Railway
# (Settings do serviço), o deploy só acontece se os testes passarem.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dependências sem falhas conhecidas (alta/crítica)
        run: npm audit --omit=dev --audit-level=high
